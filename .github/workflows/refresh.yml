name: Refresh dashboard

on:
  schedule:
    # 22:00 UTC = 9:00am Sydney while daylight saving applies (Oct to Apr).
    # When Sydney leaves DST (first Sunday of April) change this to "0 23 * * *" to keep 9am.
    - cron: "0 22 * * *"
  workflow_dispatch:        # the "Run workflow" button = manual refresh
  push:
    branches: [main]
    paths: [template.html, curated.json, build.py, .github/workflows/refresh.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Fetch previously published page (for back-fill when a feed fails)
        run: |
          curl -sSL --max-time 60 -o previous.html "${{ steps.pages.outputs.base_url }}/index.html" || true
          ls -l previous.html 2>/dev/null || echo "no previous page (first run or private Pages)"

      - name: Build page
        env:
          REFRESH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/refresh.yml
        run: python build.py --template template.html --curated curated.json --previous previous.html --out dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
